# =============================================================================
# INTERCEPT AGENT CONFIGURATION
# =============================================================================
# This file configures the Intercept remote agent.
# Copy this file and customize for your deployment.

[agent]
# Agent name (used to identify this node in the controller)
# Default: system hostname
name = sensor-node-1

# HTTP server port
# Default: 8020
port = 8020

# Comma-separated list of allowed client IPs (empty = allow all).
# NOTE: exact-match only, NOT CIDR. List the controller's exact IP(s).
# Example: 10.141.41.23, 10.141.41.24
allowed_ips =

# Enable CORS headers for browser-based clients
# Default: false
allow_cors = false


[controller]
# Controller URL for push mode
# Example: http://192.168.1.100:5050
url =

# API key for controller authentication (shared secret).
# WAJIB diisi (non-kosong) jika push_enabled=true. Controller MENOLAK push bila
# api_key kosong, atau tidak sama dengan nilai yang tersimpan saat agent didaftarkan
# di controller. Samakan nilai di sini dengan --api-key saat register_agent.py.
api_key =

# Enable automatic push of scan data to controller
# Default: false
push_enabled = false

# Push interval in seconds (minimum time between pushes)
# Default: 5
push_interval = 5


[modes]
# Enable/disable specific modes on this agent
# Set to false to disable a mode even if tools are available
# Default: all true

pager = true
sensor = true
adsb = true
ais = true
acars = true
aprs = true
wifi = true
bluetooth = true
dsc = true
rtlamr = true
tscm = true
satellite = true
listening_post = true
